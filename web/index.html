<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{--panel:#fffaf1ee;--solid:#fffaf1;--ink:#33281f;--soft:#85715d;--line:#e2d4bf;--act:#2f6f62;--warn:#c0462f;--gold:#d79a1e;--bubble:#fff;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#2a2320;color:var(--ink);font:15px/1.5 "Gowun Dodum",system-ui,sans-serif;overflow:hidden}
.view{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:min(100vw,calc((100vh - 150px)*2048/1152));top:10px;

.bgs{position:absolute;inset:0;z-index:2;pointer-events:none}

.stage.full .interior,.stage.full .win,.stage.full .lamp,.stage.full .sky{display:none}

.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));

.chip.on{background:var(--ink);color:var(--solid);border-color:var(--ink)}.chip.err{background:var(--warn);color:#fff;border-color:var(--warn)}.chip.hot{background:var(--gold);color:#fff;border-color:var(--gold)}.chip.blink{animation:bulb .5s 6 alternate}@keyframes bulb{to{background:#ffe066;box-shadow:0 0 10px #ffd000}}

.sp{flex:1}

.teams button{font:13px "Jua",sans-serif;border:0;background:transparent;border-radius:99px;padding:4px 12px;cursor:pointer;color:var(--ink)}

.teams button.on{background:var(--ink);color:#fff}.teams b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

.say button{font:14px "Jua",sans-serif;border:0;border-radius:99px;padding:7px 16px;background:var(--ink);color:var(--solid);cursor:pointer}
.say button.ghost{background:var(--chipbg);color:var(--ink);border:1px solid var(--line)}
.zone{position:absolute;transform:translate(-50%,calc(-50% + var(--zy,0px)));   z-index:2 !important;font:clamp(12px,.8vw,15px) "Jua",sans-serif;color:#fff;padding:3px 13px;border-radius:8px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 6px #0003;opacity:.95;z-index:2;border:2px solid #fff8}
.zone.common{background:#fffaf1e6!important;color:var(--zc);border:2px dashed var(--zc);font-size:clamp(11.5px,.72vw,13.5px)}
.ch{position:absolute;width:3.1%;transform:translate(-50%,-100%);cursor:pointer;z-index:3;transition:opacity .6s}
.ch .body{transform-origin:50% 100%;transform:scale(calc(var(--ps,1) * var(--hn,1)))}
.ch img{width:100%;display:block;filter:drop-shadow(0 4px 3px #0004);animation:bob 2.6s ease-in-out infinite}
.ch.walk img{animation:walk .42s ease-in-out infinite}
.ch.seat img{animation:none}.ch.spin.seat img{animation:chair 1.3s ease-in-out 2}@keyframes chair{to{transform:rotateY(360deg)}}

.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.shop button{display:flex;flex-direction:column;align-items:center;gap:2px;font:12px "Jua",sans-serif;background:var(--chipbg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 4px;cursor:pointer}
.shop button img{height:42px}.shop button:disabled{opacity:.4;cursor:default}button.b:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.ch.flip .body{transform:scale(calc(-1 * var(--ps,1) * var(--hn,1)),calc(var(--ps,1) * var(--hn,1)))}
.ch.boss{width:3.4%}.ch.boss .plate{top:auto;bottom:calc(var(--ps,1) * var(--hn,1) * 100% + 4px * var(--iz,1))}.ch.boss .bub{bottom:calc(var(--ps,1) * var(--hn,1) * 100% + (28px + var(--bo,0px)) * var(--iz,1))}   .ch.small{width:2%}.ch.tiny{width:1.5%}.ch.gone{opacity:0}.ch.dim{opacity:.25}
.ch.slack img{animation:snooze 3.6s ease-in-out infinite;filter:grayscale(.3) drop-shadow(0 4px 3px #0004)}
.ch.scold img{animation:shake .12s linear 12}
@keyframes bob{50%{transform:translateY(-3%)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9%) rotate(4deg)}}
@keyframes snooze{50%{transform:rotate(-7deg) translateY(3%)}}
@keyframes shake{25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
.ch.bump img{animation:bump .5s ease-out 1}
@keyframes bump{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14%) rotate(-12deg)}60%{transform:translateY(0) rotate(8deg)}100%{transform:none}}
.ouch{position:absolute;font:16px "Jua",sans-serif;color:#d2412b;pointer-events:none;z-index:9;animation:up 1s ease-out forwards;text-shadow:0 1px 0 #fff,0 0 4px #fff}
.plate{color:var(--scene-ink);position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;background:#fffaf1e8;border-radius:99px;padding:0 8px;margin-top:2px;box-shadow:0 1px 3px #0003}
.plate::before{content:"● ";color:var(--c,#999)}
.plate b{font:12px "Jua",sans-serif}
.ch.small .plate,.ch.tiny .plate{font-size:10px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.bub{color:var(--scene-ink);position:absolute;left:50%;bottom:calc(var(--ps,1) * var(--hn,1) * 100% + (6px + var(--bo,0px)) * var(--iz,1));transform:translateX(-50%);width:max-content;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:bottom .4s;background:var(--bubble);border-radius:12px;padding:4px 9px;font-size:12px;line-height:1.35;box-shadow:0 2px 8px #0003;z-index:6}
.bub{border:2px solid var(--tc,#0000);background:color-mix(in srgb,var(--bubble) 80%,var(--tc,#fff) 20%)}
.bub::after{content:"";position:absolute;left:50%;top:100%;border:6px solid transparent;border-top-color:var(--bubble);transform:translateX(-50%)}
.bub .tl{color:var(--act);font-family:"Jua",sans-serif}
body.nobub .bub:not(.must){display:none}
.badge{position:absolute;right:-30%;top:calc((1 - var(--ps,1) * var(--hn,1)) * 100% - 6%);font:11px "Jua",sans-serif;color:#fff;background:var(--warn);border-radius:99px;padding:0 6px;white-space:nowrap;z-index:7}
.badge.mail{background:#c0673a}.badge.seen{background:#5a7fae}.badge.listen{background:#3f8f7f}.badge.wait{background:var(--gold);animation:pulse 1s ease-in-out infinite}.badge.zz{background:#7d8a96}
@keyframes pulse{50%{transform:scale(1.15)}}
.badge.err{background:#c0392b}.badge.ask{background:var(--gold);animation:pulse .8s ease-in-out infinite}.badge.sleep{background:#4b5d7a}
.ch.err img{animation:shake .5s ease-in-out infinite;filter:sepia(.6) hue-rotate(-30deg) saturate(2) drop-shadow(0 0 8px #e74c3cbb)}
.ch.err .body{position:relative}.ch.err .body::after{content:"";position:absolute;left:20%;right:20%;top:-25%;height:40%;border-radius:50%;background:radial-gradient(#e74c3c99,#e74c3c00 70%);animation:smoke 1.6s ease-out infinite;pointer-events:none}
.ch.sleep img{filter:grayscale(.6) brightness(.85) drop-shadow(0 4px 3px #0004);transform:rotate(-8deg)}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-60%) scale(1.3);opacity:0}}
.adoc{position:relative;width:100%;max-width:520px;margin:10px auto 4px;aspect-ratio:706/1000;container-type:inline-size;background:url(img/approval/paper_2.png) center/100% 100% no-repeat;color:#4a3a2a;font-family:"Gowun Dodum",sans-serif;word-break:keep-all}

.adoc .b1{left:11%;width:23%}.adoc .b2{left:38.2%;width:23.7%}.adoc .b3{left:66.3%;width:22.9%}
.adoc .ast{left:66.3%;top:91.2%;width:22.9%;text-align:center;font-size:2.2cqw;font-weight:700}.adoc .ast.wait{color:#9a6a12}.adoc .ast.ok{color:#c8231e}.adoc .ast.no{color:#555}.adoc .ast.hold{color:#3f6f8f}details pre.nu{color:#c8231e;font-weight:700}.adoc .arow.nu{font-weight:700;color:#c8231e;font-size:2.6cqw}
.flag{color:#c0392b;font-size:12px;margin-right:6px;white-space:nowrap}
.nlamp{position:absolute;width:9%;aspect-ratio:1.6;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#ffd98a88,#ffd98a33 45%,#ffd98a00 70%);mix-blend-mode:screen;z-index:2;pointer-events:none;animation:lampf 3s ease-in-out infinite}@keyframes lampf{50%{opacity:.8}}

.inq{position:absolute;z-index:6;font-size:calc(17px * var(--iz,1));animation:bulb .6s infinite alternate;pointer-events:auto}
.egg{position:absolute;transform:translate(-50%,-100%);z-index:4;display:flex;flex-direction:column;align-items:center;pointer-events:auto}.egg .eg{font-size:calc(26px * 1);animation:eggw 20s infinite;filter:drop-shadow(0 2px 1px #0006)}.egg small{font:calc(9px * 1) Jua,sans-serif;background:#fff;border:1px dashed #8a6a10;color:#5a381d;border-radius:4px;padding:0 3px;white-space:nowrap}
@keyframes eggw{0%,96%,100%{transform:rotate(0)}97%{transform:rotate(-14deg)}98%{transform:rotate(12deg)}99%{transform:rotate(-6deg)}}.revq{position:absolute;z-index:6;font-size:calc(18px * var(--iz,1));pointer-events:auto}
.sndk{display:inline-block;position:relative}.sndk summary{cursor:pointer;list-style:none}.sndk[open] label{display:block;white-space:nowrap}.sndk[open]{background:var(--chipbg,#fff);border:1px solid var(--line,#ccc);border-radius:8px;padding:2px 6px;position:absolute;z-index:30}
.battbar{position:absolute;transform:translate(-50%,0);z-index:5;width:calc(36px * var(--iz,1));height:calc(4px * var(--iz,1));background:#0004;border-radius:2px;pointer-events:auto}.battbar i{display:block;height:100%;border-radius:2px}.battbar b{position:absolute;right:-1.2em;top:-.55em;font-size:calc(9px * var(--iz,1))}
.fly{position:absolute;z-index:7;transform:translate(-50%,-50%);pointer-events:none;font-size:calc(18px * var(--iz,1));filter:drop-shadow(1px 2px 1px #0005)}.fly small{display:block;font:calc(8px * var(--iz,1)) Jua,sans-serif;background:#fffbe8;color:#5a381d;padding:0 2px;border-radius:2px;white-space:nowrap}
.starf.live{border-style:dashed;opacity:.9}.starf img{width:calc(26px * 1);height:calc(26px * 1);object-fit:contain}
.arcb{position:absolute;transform:translate(-50%,-100%);z-index:4;background:#1d2a1f;color:#d8f5c8;border:2px solid #6b4325;border-radius:4px;padding:2px 6px;font:calc(10px * 1)/1.3 Jua,sans-serif;white-space:nowrap;pointer-events:none}
.away{position:absolute;transform:translate(-50%,-100%);z-index:4;background:#fffaf1e8;color:#5a381d;border:1px solid #c9a27a;border-radius:6px;padding:0 6px;font:calc(12px * 1) Jua,sans-serif;white-space:nowrap;pointer-events:auto}
.dust{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;z-index:4;filter:grayscale(.4);line-height:1}
.ch{touch-action:none}.ch.held{cursor:grabbing;filter:drop-shadow(0 10px 6px #0006);z-index:999!important}.ch.pinned .plate::after{content:" 📌"}
.bin{position:absolute;transform:translate(-50%,-100%);z-index:3;cursor:pointer;pointer-events:auto;text-align:center;line-height:1}.bin i{display:block;font-style:normal;font-size:.45em;letter-spacing:-.35em;margin-bottom:-.2em}.bin s{text-decoration:none;font-size:.5em;position:absolute;left:100%;bottom:0;rotate:30deg}.bin em{position:absolute;left:50%;top:100%;translate:-50% 2px;font:10px "Jua",sans-serif;background:#fffaf1e6;color:#33281f;border-radius:6px;padding:0 4px;white-space:nowrap;scale:var(--iz,1)}.bin.stomp{animation:stomp 1s ease-out}@keyframes stomp{30%{transform:translate(-50%,-100%) scaleY(.55)}60%{transform:translate(-50%,-100%) scaleY(1.1)}}

.tower.fall{transform:translate(-50%,-100%) rotate(18deg);transform-origin:50% 100%;animation:topple .9s ease-in}@keyframes topple{0%{transform:translate(-50%,-100%) rotate(0)}70%{transform:translate(-50%,-100%) rotate(24deg)}100%{transform:translate(-50%,-100%) rotate(18deg)}}
.wb{position:absolute;transform:translate(-50%,-50%);z-index:2;pointer-events:none;background:#f7f9fb;border:4px solid #8a8f96;border-radius:4px;box-shadow:0 3px 8px #0004;padding:.3vw .6vw;display:flex;flex-direction:column;gap:.05vw;font:clamp(8px,.62vw,12px)/1.35 "Jua",sans-serif;color:#2a3d5a;white-space:nowrap}.wb b{color:#c0392b;font-size:1.15em}.wb.can{pointer-events:auto;cursor:pointer}.wb .wbl{font-style:normal;color:#1d4e89;max-width:16em;white-space:normal}.wb .wbl.dim{opacity:.55}

        (p.more?`<div class="muted" style="white-space:pre-wrap">${esc(p.more)}</div>`:"")+
        (p.mark?`<div class="muted" style="margin-top:4px;border-left:3px solid #c9a227;padding-left:6px">${esc(p.mark)}</div>`:"")+`</details>`:"")+
      `<div class="row" style="margin-top:4px">${[["좋아","👍 좋아"],["다음에","⏳ 다음에"],["빼","✋ 빼"]].map(([v,l])=>`<button class="b${i.vote===v?"":" ghost"}" data-vk="${esc(i.key)}" data-v="${v}"${can?"":" disabled"}>${l}</button>`).join("")}</div></div>`};
  const todo=I.filter(i=>!i.vote&&!ideaHeld(i)),done=I.filter(i=>i.vote||ideaHeld(i)),cnt=v=>done.filter(i=>i.vote===v).length,nh=done.filter(ideaHeld).length;
  P.innerHTML=bar+`<div class="muted">공유 폴더 backlog.md 의 아이디어 · 결재 꼴. ${can?"아직 안 정한 것만 위에 · 눌러서 고르면 리더가 「좋아」부터 만들어.":"투표는 리더 화면에서만."}</div>`+
    (todo.map(card).join("")||(I.length?`<div class="muted" style="margin:8px 0">새로 정할 아이디어 없음 🎉</div>`:""))+
    (done.length?`<details class="item"><summary class="muted" data-k="idea-done">이미 정한 것 ${done.length}개 · 👍 ${cnt("좋아")} · ⏳ ${cnt("다음에")} · ✋ ${cnt("빼")}${nh?" · ⏸ "+nh:""}</summary>${done.map(card).join("")}</details>`:"")+
    (I.length?"":'<div class="muted">아이디어 없음(또는 이 화면엔 안 보임)</div>');
  P.querySelectorAll("[data-vk]").forEach(b=>b.onclick=()=>{const it=(S.ideas||[]).find(x=>x.key===b.dataset.vk),v=it&&it.vote===b.dataset.v?null:b.dataset.v;
    fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:b.dataset.vk,v})}).then(r=>r.json()).then(j=>{if(j.ok&&it){it.vote=v;side()}})});
}
const ideaSeen=new Set();let ideaInit=false;
function ideaBulb(){const I=S.ideas||[];let fresh=0;for(const i of I)if(!ideaSeen.has(i.key)){ideaSeen.add(i.key);fresh++}
  if(ideaInit&&fresh){const b=document.querySelector('[data-tab="docs"]');if(b){b.classList.remove("blink");void b.offsetWidth;b.classList.add("blink")}
    for(let i=0;i<Math.min(fresh,3);i++)setTimeout(()=>{fly("🟨",posOf(S.leader||LEAD),[1040+i*14,300+i*6],1.0,"",60,"pi"+i);sfx("pal")},i*250);
    const m=(S.agents||[]).find(a=>a.dev===(S.leader||LEAD)&&a.who!=="intern");if(m){fx(m.id,"📝 착!");say(m.id,"아이디어 "+fresh+"장 붙였어요")}}ideaInit=true}
let tickBusy=0;

let tickSeq=0;
function tick(){lastTick=Date.now();const pipOnly=document.hidden&&!!pipWin;if(document.hidden&&!pipOnly||tickBusy&&Date.now()-tickBusy<10000)return;tickBusy=Date.now();
  const my=++tickSeq,ac=window.AbortController?new AbortController():null,to=ac?setTimeout(()=>ac.abort(),8000):0;
  fetch("/api/state?jerr="+JERR.n+"&tab="+TABID,ac?{signal:ac.signal}:{}).then(r=>{if(!r.ok)throw {why:"답 "+r.status};return r.json().catch(()=>{throw {why:"상태 글 깨짐"}})}).then(j=>{
    if(my!==tickSeq)return;
    if(!j||!Array.isArray(j.agents))throw {why:"상태 꼴 이상"};S=j;
    const se=$("devs").querySelector(".srverr");if(se)se.remove();
    if(pipOnly){try{pipFill()}catch(e){jerr("작게 · "+(e&&e.message||e))}return}
    try{replyBubbles();ideaBulb();render();flights();shareFx();pipFill()}catch(e){console.error("그리기 오류(서버는 붙어 있음)",e);jerr("그리기 · "+(e&&e.message||e))}
  }).catch(e=>{if(my!==tickSeq)return;$("devs").innerHTML=`<span class="dev srverr">${e&&e.why?"서버 답 이상 · "+esc(e.why):"서버 연결 안 됨"}</span>`}).finally(()=>{clearTimeout(to);if(my===tickSeq)tickBusy=0})}
setInterval(tick,2000);tick();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
</script>

<div id="guide" class="guide" hidden></div>
<style>
.guide{position:fixed;left:50%;transform:translateX(-50%);top:max(112px,calc(var(--toph,0px) + 8px));z-index:30;width:min(380px,calc(100vw - 32px));
  background:var(--solid);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:8px 10px 10px;box-shadow:0 10px 30px #0004;font-size:15px}
.guide .gh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.guide .gh b{flex:1;font:17px Jua,sans-serif}
.guide .gx{border:0;background:none;color:var(--soft);cursor:pointer;font-size:16px}
.guide .gi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--chipbg,transparent);color:var(--ink);
  border-radius:10px;padding:7px 9px;margin-top:5px;cursor:pointer;font:inherit}
.guide .gi:hover{border-color:var(--act)}.guide .gi>span:nth-child(2){flex:1}.guide .gi .go{color:var(--act);white-space:nowrap}
.guide .gi.new{border-color:var(--gold)}.guide .gi em{font-style:normal;font-size:12px;color:#fff;background:var(--gold);border-radius:99px;padding:0 6px}
.guide .g0{color:var(--ink)}.guide .g0 .muted{margin-top:4px}
</style>
<script>
(function(){
  const box=document.getElementById("guide"),btn=document.getElementById("guidebtn"),AWAY=30*60e3;
  let prev=null,mv=0,t0=0,memLast=0;
  const last=()=>{let v=0;try{v=+localStorage.getItem("boss_last")||0}catch(e){}return Math.max(v,memLast)};
  const mark=()=>{memLast=Date.now();try{localStorage.setItem("boss_last",String(memLast))}catch(e){}};
  const openTab=k=>{tab=k;openChat=null;document.getElementById("drawer").hidden=false;chips();side()};
  const nm=a=>st(a.who).name||DEVKO[a.dev]||a.dev;
  function items(){const SI=S.sites||{},L=[],A=(S.agents||[]).filter(a=>a.who!=="intern");
    for(const a of A.filter(a=>a.wait))L.push({k:"ask",n:1,ico:"❓",txt:`${josa(nm(a),"이","가")} 질문 드리고 기다려요 · ${DEVKO[a.dev]||a.dev} 창에서 골라 주세요`,go:()=>{sel=a.id;person()}});
    for(const a of A.filter(a=>a.ask&&!a.wait))L.push({k:"ok",n:1,ico:"✋",txt:`${josa(nm(a),"이","가")} 허락 기다려요 · ${DEVKO[a.dev]||a.dev} 창에서 허락 · 거절`,go:()=>{sel=a.id;person()}});
    const sign=(S.approvals||[]).filter(a=>(a.status||"대기")==="대기");
    if(sign.length)L.push({k:"sign",n:sign.length,ico:"🖋️",txt:`결재 기다리는 서류 ${sign.length}건${sign[0].title?" · 「"+String(sign[0].title).slice(0,22)+"」"+(sign.length>1?" 외":""):""}`,go:()=>{store.set("docsub","sign");openTab("docs")}});

    const pt=W4.filter(d=>((SI[d]||{}).patrol||{}).n);
    if(pt.length)L.push({k:"pat",n:pt.length,ico:"🚨",txt:`순찰에 걸린 곳 · ${pt.map(d=>DEVKO[d]).join(" · ")}`,go:()=>{const e=extraEls.siren;if(e)e.click()}});
    const gr=(S.gripes||[]).filter(g=>g.about==="boss"&&g.status==="접수");
    if(gr.length)L.push({k:"gripe",n:gr.length,ico:"😤",txt:`사장님께 온 불만 ${gr.length}건`,go:()=>openTab("gripe")});
    return L}
  const counts=L=>{const c={};L.forEach(x=>c[x.k]=(c[x.k]||0)+x.n);return c};
  function hint(){const C=(S.cards||[]).filter(c=>!c.done).length,mt=(S.meetings||[])[0];
    return `<div class="muted">둘러보실 곳: ${mt?`회의 탭 ${mt.id.slice(9,11)}:${mt.id.slice(11,13)} 회의${mt.result?" 결과":""} · `:""}일 카드 ${C}장 · 비서 브리핑의 🌅 아침 한 장</div>`}
  function show(L,fresh,hello){
    box.innerHTML=`<div class="gh"><b>${hello?"🐾 어서 오세요, 사장님!":"🧭 지금 정해 주실 것"}</b><button class="gx" title="닫기 (Esc)">✕</button></div>`+
      (L.length?L.map((x,i)=>`<button class="gi${fresh.has(x.k)?" new":""}" data-i="${i}"><span>${x.ico}</span><span>${esc(x.txt)}</span>${fresh.has(x.k)?"<em>새로</em>":""}<span class="go">보기 ›</span></button>`).join("")
        :`<div class="g0">🌿 지금 급하게 정해 주실 건 없어요.${hint()}</div>`);
    box.hidden=false;box.dataset.hello=hello?"1":"";
    box.querySelectorAll(".gi").forEach(b=>b.onclick=()=>{const x=L[+b.dataset.i];box.hidden=true;try{x.go()}catch(e){jerr("안내판 · "+(e&&e.message||e))}});
    box.querySelector(".gx").onclick=()=>{box.hidden=true};
    clearTimeout(box._t);if(!L.length)box._t=setTimeout(()=>{box.hidden=true},9000)}
  function greet(){const A=(S.agents||[]).filter(a=>a.who!=="intern"&&a.room!=="off"),H=["사장님 오셨어요!","어서 오세요, 사장님 ☕","기다리고 있었어요!","오늘도 반가워요 🐾"];
    A.forEach((a,i)=>setTimeout(()=>{try{say(a.id,H[i%H.length])}catch(e){}},400+i*900))}
  function hello(){if(!S)return;const away=Date.now()-last()>AWAY;mark();if(!away)return;
    const L=items();prev=counts(L);greet();show(L,new Set(),true)}
  function check(){if(!S)return;const L=items(),cur=counts(L);
    btn.classList.toggle("hot",L.length>0);btn.textContent=L.length?"🧭 "+L.length:"🧭";
    if(document.hidden)return;
    if(prev===null){prev=cur;t0=Date.now();hello();return}
    if(Date.now()-t0<10000){prev=cur;if(!box.hidden&&box.dataset.hello)show(L,new Set(),true);return}
    const fresh=new Set(Object.keys(cur).filter(k=>cur[k]>(prev[k]||0)));prev=cur;
    if(fresh.size){show(L,fresh,!box.hidden&&!!box.dataset.hello);const h=(S.agents||[]).find(a=>a.who===(S.leader||LEAD));if(h)try{say(h.id,"사장님, 정해 주실 게 왔어요 🧭")}catch(e){}}}
  setInterval(()=>{try{check()}catch(e){jerr("안내판 · "+(e&&e.message||e))}},2000);
  ["pointerdown","keydown","pointermove","wheel"].forEach(t=>addEventListener(t,()=>{if(Date.now()-mv<5000)return;mv=Date.now();try{hello()}catch(e){jerr("맞이 · "+(e&&e.message||e))}},{passive:true}));
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)try{hello()}catch(e){jerr("맞이 · "+(e&&e.message||e))}});
  btn.onclick=()=>{if(!S)return;if(!box.hidden){box.hidden=true;return}show(items(),new Set(),false)};
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!box.hidden)box.hidden=true});
})();
</script>
